<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands - ZNE</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="https://zne.breed.rip/assets/zne_fat.png">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container" id="navContainer">
            <a href="/" class="nav-logo">
                <div class="nav-logo-icon">
                    <img src="https://zne.breed.rip/assets/zne.png" alt="ZNE">
                </div>
                <span class="nav-logo-text">ZNE</span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item">
                    <a href="/" class="nav-link" data-page="home">Home</a>
                </li>
                <li class="nav-item">
                    <a href="/webhook" class="nav-link" data-page="webhook">Webhook</a>
                </li>
                <li class="nav-item">
                    <a href="/commands" class="nav-link active" data-page="commands">Commands</a>
                </li>
                <li class="nav-item">
                    <a href="/leaderboard" class="nav-link" data-page="leaderboard">Leaderboard</a>
                </li>
                <li class="nav-item">
                    <a href="/tos" class="nav-link" data-page="tos">Terms</a>
                </li>
                <li class="nav-item">
                    <a href="/streaming" class="nav-link" data-page="streaming">Streaming</a>
                </li>
                <div class="nav-actions">
                    <button class="nav-login">Login</button>
                    <a href="https://discord.gg/U5q7SnGnet" target="_blank" rel="noopener noreferrer" class="nav-invite">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Invite
                    </a>
                </div>
            </ul>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </nav>

    <main class="main">
        <div class="commands-loading" id="commandsLoading">
            <div class="loading-spinner"></div>
            <span class="loading-text">Loading Commands</span>
        </div>

        <div class="commands-content" id="commandsContent" style="display: none;">
            <div class="commands-header">
                <h1 class="commands-title">Commands</h1>
                <p class="commands-subtitle">Explore all available commands for ZNE.</p>
            </div>

            <div class="commands-search">
                <input type="text" id="commandsSearch" class="search-input" placeholder="Search commands...">
            </div>

            <div class="categories-wrapper">
                <div class="categories" id="categories">
                    <button class="category-pill active" data-category="all">All</button>
                    <!-- Category pills inserted dynamically -->
                </div>
            </div>

            <div class="commands-grid" id="commandsGrid">
                <!-- Commands will be inserted here dynamically -->
            </div>

            <div class="commands-empty" id="commandsEmpty" style="display: none;">
                <p>No commands found.</p>
            </div>
        </div>

        <div class="commands-error" id="commandsError" style="display: none;">
            <div class="error-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
            <p class="error-text">Failed to load commands.</p>
            <button class="btn-retry" id="retryBtn">Try Again</button>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 ZNE. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
